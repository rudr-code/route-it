version: '3.8'

services:
  routeit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routeit-fleet-system
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - ROUTEIT_DB_PATH=/app/data/routeit_delivery.db
    volumes:
      - routeit-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  routeit-data:
